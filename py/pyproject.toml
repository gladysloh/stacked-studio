[project]
name = "stacked-media"
version = "0.1.0"
description = "Optional local media tools for stacked-studio (cutouts, palette, OCR, video analysis). No model API calls."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
media = ["pillow>=10"]
cutout = ["pillow>=10", "rembg>=2.0.60", "onnxruntime>=1.18"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stacked_media"]
